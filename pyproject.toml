[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mangabinder"
dynamic = ["version"]
description = "Download manga chapters, convert them to PDF, bind them into volumes and export CBZ - from the command line or a local web UI."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mohammad Owais" }]
keywords = ["manga", "downloader", "pdf", "cbz", "comics", "scraper", "volumes"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
    "Topic :: Utilities",
]
dependencies = [
    "pillow>=9.1",
    "tqdm>=4.60",
    "pypdf>=3.9",
    "pypdfium2>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "build", "twine"]

[project.urls]
Homepage = "https://github.com/Preygle/manga-downloader"
Issues = "https://github.com/Preygle/manga-downloader/issues"
Releases = "https://github.com/Preygle/manga-downloader/releases"

[project.scripts]
mangabinder = "mangabinder.cli:main"

[tool.hatch.version]
path = "src/mangabinder/__init__.py"

[tool.hatch.build.targets.sdist]
exclude = ["/docs", "/.github", "/packaging"]

[tool.pytest.ini_options]
testpaths = ["tests"]
