name: Release

# Runs when a GitHub release is published:
#
#   GitHub release  wheel, sdist and mangabinder.exe (Windows, web UI) attached
#   PyPI            trusted publishing (configured on pypi.org, environment "pypi")
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag matches the package version
        if: github.event_name == 'release'
        run: |
          version=$(grep -Po '__version__ = "\K[^"]+' src/mangabinder/__init__.py)
          test "${{ github.event.release.tag_name }}" = "v$version"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber

  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install . pyinstaller
      - name: Build mangabinder.exe
        run: >
          pyinstaller --noconfirm --clean --onefile --console --name mangabinder
          --icon packaging/icon.ico --collect-all pypdfium2 --collect-all pypdfium2_raw
          packaging/entry.py
      - name: Smoke test
        run: |
          dist/mangabinder.exe --version
          dist/mangabinder.exe --help
      - uses: actions/upload-artifact@v4
        with:
          name: mangabinder-windows
          path: dist/mangabinder.exe
      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/mangabinder.exe --clobber

  pypi:
    if: github.event_name == 'release'
    needs: package
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/mangabinder/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
