name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: mangabinder --version

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t mangabinder:test .
      - name: Web UI answers from inside the container
        run: |
          docker run -d --name mb -p 8765:8765 mangabinder:test
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8765/ | grep -q MangaBinder && break; sleep 1; done
          curl -fs http://127.0.0.1:8765/api/library
          docker run --rm mangabinder:test --version
          docker logs mb
